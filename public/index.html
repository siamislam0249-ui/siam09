<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunch Poll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;}
  :root{
    --bg-0:#060B16;
    --bg-1:#0C1626;
    --bg-2:#122036;
    --panel:#0F1A2E;
    --blue:#2FA8FF;
    --blue-2:#5FD4FF;
    --blue-deep:#1560C4;
    --ink:#EAF3FF;
    --muted:#8FA6C4;
    --danger:#FF5C6C;
    --success:#3FD98A;
    --glow: 0 0 18px rgba(47,168,255,0.55), 0 0 44px rgba(47,168,255,0.25);
    --glow-soft: 0 0 10px rgba(47,168,255,0.35);
  }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(47,168,255,0.16), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(95,212,255,0.10), transparent 40%),
      var(--bg-0);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:36px 16px;
  }
  .app{width:100%; max-width:480px;}
  .brand{text-align:center; margin-bottom:26px;}
  .brand h1{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:1px;
    color:var(--blue-2);
    text-shadow: 0 0 12px rgba(95,212,255,0.7), 0 0 28px rgba(47,168,255,0.4);
  }
  .brand p{
    margin:0;
    font-size:12px;
    letter-spacing:3px;
    color:var(--muted);
    font-family:'Orbitron', sans-serif;
  }
  .board{
    background:
      linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0) 40%),
      var(--panel);
    border:1px solid rgba(95,212,255,0.18);
    border-radius:16px;
    padding:30px 26px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.06),
      var(--glow-soft);
  }
  h2.section-title{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 20px;
    color:var(--ink);
    letter-spacing:0.4px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:0 0 7px;
    letter-spacing:0.4px;
  }
  input[type=text], input[type=password]{
    width:100%;
    background:var(--bg-1);
    border:1px solid rgba(95,212,255,0.16);
    color:var(--ink);
    padding:12px 13px;
    border-radius:10px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    margin-bottom:16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
  }
  input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 3px rgba(47,168,255,0.25);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:none;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.6px;
    cursor:pointer;
    color:#04101F;
    background:linear-gradient(180deg, var(--blue-2), var(--blue) 60%, var(--blue-deep));
    box-shadow:
      0 8px 0 rgba(11,55,110,0.9),
      0 12px 22px rgba(47,168,255,0.35),
      inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{
    transform: translateY(4px);
    box-shadow:
      0 3px 0 rgba(11,55,110,0.9),
      0 6px 14px rgba(47,168,255,0.3),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .btn:disabled{opacity:0.45; cursor:not-allowed; filter:none;}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid rgba(95,212,255,0.35);
    box-shadow:none;
  }
  .btn.ghost:hover{background:rgba(47,168,255,0.08); box-shadow:var(--glow-soft);}
  .btn.ghost:active{transform:translateY(1px);}
  .btn.danger{
    background:linear-gradient(180deg, #FF8A93, var(--danger) 60%, #B23440);
    box-shadow: 0 8px 0 rgba(120,20,30,0.9), 0 12px 22px rgba(255,92,108,0.3);
  }
  .tabs{display:flex; gap:6px; margin-bottom:20px;}
  .tab{
    flex:1;
    text-align:center;
    padding:10px 0;
    font-family:'Orbitron', sans-serif;
    font-size:12px;
    letter-spacing:0.4px;
    color:var(--muted);
    border-bottom:2px solid rgba(95,212,255,0.15);
    cursor:pointer;
  }
  .tab.active{color:var(--blue-2); border-bottom-color:var(--blue); text-shadow:0 0 10px rgba(95,212,255,0.6);}
  .msg{font-size:13px; padding:11px 13px; border-radius:10px; margin-bottom:16px;}
  .msg.error{background:rgba(255,92,108,0.14); color:#FFB3BB; border:1px solid rgba(255,92,108,0.4);}
  .msg.ok{background:rgba(63,217,138,0.14); color:#AEF3CE; border:1px solid rgba(63,217,138,0.4);}
  .landing{text-align:center; padding:18px 4px 4px;}
  .landing .glow-orb{
    width:88px; height:88px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(47,168,255,0.15) 60%);
    box-shadow: var(--glow), inset 0 0 20px rgba(255,255,255,0.15);
  }
  .landing h2{
    font-family:'Orbitron', sans-serif;
    font-size:22px;
    margin:0 0 8px;
    color:var(--blue-2);
    text-shadow: 0 0 14px rgba(95,212,255,0.6);
  }
  .landing p{color:var(--muted); font-size:13px; margin:0 0 26px;}
  .menu-list{list-style:none; margin:0 0 18px; padding:0;}
  .menu-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 15px;
    border:1px solid rgba(95,212,255,0.14);
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 6px 14px rgba(0,0,0,0.3);
    transition: box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .menu-item:hover{border-color:rgba(95,212,255,0.4);}
  .menu-item.selected{
    border-color:var(--blue);
    box-shadow: var(--glow-soft), inset 0 1px 0 rgba(255,255,255,0.06);
    background:linear-gradient(180deg, rgba(47,168,255,0.12), transparent);
  }
  .menu-item .emoji{font-size:27px; width:36px; text-align:center;}
  .menu-item .name{font-size:16px; font-weight:600;}
  .menu-item input[type=radio]{margin-left:auto; width:19px; height:19px; accent-color:var(--blue);}
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; font-size:12px; color:var(--muted);
  }
  .topbar .link, .link{color:var(--blue-2); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .ticket{
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 50%), var(--bg-1);
    border:1px solid rgba(63,217,138,0.35);
    border-radius:14px;
    padding:22px 20px;
    margin-bottom:20px;
    box-shadow: 0 0 22px rgba(63,217,138,0.18), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .ticket .stamp{
    display:inline-block;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    color:var(--success);
    border:2px solid var(--success);
    padding:4px 11px;
    border-radius:8px;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:12px;
    box-shadow: 0 0 12px rgba(63,217,138,0.4);
  }
  .ticket h3{font-family:'Orbitron', sans-serif; margin:0 0 6px; font-size:19px;}
  .ticket p{margin:2px 0; font-size:12px; color:var(--muted);}
  .perf{border-top:1px dashed rgba(143,166,196,0.3); margin:14px 0;}
  .tally-row{display:flex; align-items:center; gap:10px; margin-bottom:11px; font-size:14px;}
  .tally-row .bar-wrap{flex:1; background:var(--bg-1); border-radius:6px; height:11px; overflow:hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);}
  .tally-row .bar{height:100%; background:linear-gradient(90deg, var(--blue-deep), var(--blue-2)); box-shadow: 0 0 8px rgba(47,168,255,0.6);}
  .tally-row .count{font-family:'Orbitron', sans-serif; width:26px; text-align:right; font-size:12px;}
  .field-row{display:flex; gap:10px; align-items:flex-end; margin-bottom:10px;}
  .field-row input[type=text]{margin-bottom:0;}
  .field-row .emoji-input{width:64px; text-align:center;}
  .field-row .name-input{flex:1;}
  .icon-btn{
    background:transparent;
    border:1px solid rgba(255,92,108,0.4);
    color:var(--danger);
    border-radius:10px;
    width:40px; height:40px;
    cursor:pointer;
    font-size:16px;
  }
  .icon-btn:hover{background:rgba(255,92,108,0.12); box-shadow:0 0 10px rgba(255,92,108,0.3);}
  .hint{font-size:12px; color:var(--muted); margin:-4px 0 16px;}
  .divider{height:1px; background:rgba(95,212,255,0.14); margin:22px 0;}
  .stack > * + *{margin-top:10px;}
  select{
    width:100%;
    background:var(--bg-1);
    border:1px solid rgba(95,212,255,0.16);
    color:var(--ink);
    padding:11px 12px;
    border-radius:10px;
    font-size:14px;
    margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>LUNCH POLL</h1>
    <p>DAILY MENU VOTE</p>
  </div>
  <div class="board" id="board"></div>
</div>

<script>
const board = document.getElementById('board');
let currentUser = null;
let isAdmin = false;
let authMode = 'login';
let selectedItem = null;

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayDisplay(){
  const d = new Date();
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

// ---------- API HELPER ----------
async function api(path, options={}){
  const res = await fetch(path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error(data.error || 'Something went wrong.');
    err.status = res.status;
    throw err;
  }
  return data;
}
async function getMenu(date){
  return api('/api/menu?date=' + encodeURIComponent(date));
}
async function saveMenu(date, items){
  return api('/api/menu', { method:'POST', body: JSON.stringify({ date, items }) });
}
async function getVotesData(date){
  return api('/api/votes?date=' + encodeURIComponent(date));
}
async function submitVote(date, itemId){
  return api('/api/votes', { method:'POST', body: JSON.stringify({ date, itemId }) });
}

function render(html){ board.innerHTML = html; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- AUTH SCREEN ----------
function renderAuth(errorMsg){
  render(`
    <h2 class="section-title">${authMode === 'login' ? 'Sign in' : 'Create your account'}</h2>
    <div class="tabs">
      <div class="tab ${authMode==='login'?'active':''}" data-tab="login">LOGIN</div>
      <div class="tab ${authMode==='register'?'active':''}" data-tab="register">REGISTER</div>
    </div>
    ${errorMsg ? `<div class="msg error">${escapeHtml(errorMsg)}</div>` : ''}
    <label for="uname">Username</label>
    <input type="text" id="uname" autocomplete="username" placeholder="e.g. alex">
    <label for="upass">Password</label>
    <input type="password" id="upass" autocomplete="current-password" placeholder="${authMode==='register' ? 'Min 8 characters' : 'Enter password'}">
    <button class="btn" id="authSubmit">${authMode==='login' ? 'Sign in' : 'Create account'}</button>
  `);
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ authMode = t.dataset.tab; renderAuth(); };
  });
  document.getElementById('authSubmit').onclick = handleAuthSubmit;
  document.getElementById('upass').addEventListener('keydown', e=>{
    if(e.key==='Enter') handleAuthSubmit();
  });
}

async function handleAuthSubmit(){
  const uname = document.getElementById('uname').value.trim();
  const upass = document.getElementById('upass').value;
  if(!uname || !upass){
    renderAuth('Please enter both a username and password.');
    return;
  }
  const btn = document.getElementById('authSubmit');
  btn.disabled = true;
  try{
    const endpoint = authMode === 'register' ? '/api/register' : '/api/login';
    const data = await api(endpoint, { method:'POST', body: JSON.stringify({ username: uname, password: upass }) });
    currentUser = data.username;
    isAdmin = data.isAdmin;
    if(isAdmin){ await renderAdminScreen(); } else { await renderLanding(); }
  }catch(e){
    renderAuth(e.message);
    document.getElementById('authSubmit') && (document.getElementById('authSubmit').disabled = false);
  }
}

// ---------- LANDING (PAGE 2) ----------
async function renderLanding(){
  render(`
    <div class="topbar">
      <span>👤 ${escapeHtml(currentUser)}</span>
      <span class="link" id="logoutLink">Logout</span>
    </div>
    <div class="landing">
      <div class="glow-orb">🍱</div>
      <h2>Today's Lunch Menu</h2>
      <p>${todayDisplay()}</p>
      <button class="btn" id="viewMenuBtn">View menu &amp; vote</button>
    </div>
  `);
  document.getElementById('logoutLink').onclick = doLogout;
  document.getElementById('viewMenuBtn').onclick = renderVoteScreen;
}

// ---------- VOTE SCREEN (PAGE 3) ----------
async function renderVoteScreen(){
  const date = todayStr();
  let menuData, votesData;
  try{
    menuData = await getMenu(date);
    votesData = await getVotesData(date);
  }catch(e){
    render(`<div class="msg error">${escapeHtml(e.message)}</div>`);
    return;
  }

  const topHtml = `
    <div class="topbar">
      <span class="link" id="backLink">&larr; Back</span>
      <span class="link" id="logoutLink">Logout</span>
    </div>
  `;

  const alreadyVoted = votesData.myVote !== null;

  if(alreadyVoted){
    const myChoice = votesData.tally.find(i=>i.id === votesData.myVote);
    const tallyHtml = buildTallyHtml(votesData.tally, votesData.total);
    render(topHtml + `
      <div class="ticket">
        <span class="stamp">✔ VOTE RECORDED</span>
        <h3>${myChoice ? myChoice.emoji+' '+escapeHtml(myChoice.name) : 'Unknown'}</h3>
        <p>Date: ${date}</p>
        <div class="perf"></div>
        <p>Thanks for voting, ${escapeHtml(currentUser)}!</p>
      </div>
      <h2 class="section-title">Today's results</h2>
      ${tallyHtml}
    `);
    document.getElementById('backLink').onclick = renderLanding;
    document.getElementById('logoutLink').onclick = doLogout;
    return;
  }

  const itemsHtml = menuData.items.map(item => `
    <li class="menu-item ${selectedItem===item.id?'selected':''}" data-id="${item.id}">
      <span class="emoji">${item.emoji}</span>
      <span class="name">${escapeHtml(item.name)}</span>
      <input type="radio" name="menuChoice" ${selectedItem===item.id?'checked':''} readonly>
    </li>
  `).join('');

  render(topHtml + `
    <h2 class="section-title">What's for lunch today?</h2>
    <ul class="menu-list">${itemsHtml}</ul>
    <button class="btn" id="submitVote" ${selectedItem? '' : 'disabled'}>Submit vote</button>
  `);

  document.querySelectorAll('.menu-item').forEach(el=>{
    el.onclick = ()=>{ selectedItem = el.dataset.id; renderVoteScreen(); };
  });
  document.getElementById('backLink').onclick = renderLanding;
  document.getElementById('logoutLink').onclick = doLogout;
  const submitBtn = document.getElementById('submitVote');
  if(submitBtn){
    submitBtn.onclick = async ()=>{
      if(!selectedItem) return;
      submitBtn.disabled = true;
      try{
        await submitVote(date, selectedItem);
        selectedItem = null;
        await renderVoteScreen();
      }catch(e){
        render(topHtml + `<div class="msg error">${escapeHtml(e.message)}</div>`);
      }
    };
  }
}

function buildTallyHtml(tally, total){
  const t = total || 1;
  return tally.map(item=>{
    const pct = Math.round((item.count/t)*100);
    return `
      <div class="tally-row">
        <span>${item.emoji}</span>
        <div class="bar-wrap"><div class="bar" style="width:${pct}%;"></div></div>
        <span class="count">${item.count}</span>
      </div>
    `;
  }).join('');
}

async function doLogout(){
  try{ await api('/api/logout', { method:'POST' }); }catch(e){}
  currentUser = null;
  isAdmin = false;
  selectedItem = null;
  authMode = 'login';
  renderAuth();
}

// ---------- ADMIN SCREEN ----------
let draftItems = [];

async function renderAdminScreen(msg){
  const date = todayStr();
  let menuData;
  try{
    menuData = await getMenu(date);
  }catch(e){
    render(`<div class="msg error">${escapeHtml(e.message)}</div>`);
    return;
  }
  draftItems = menuData.items.length ? menuData.items.map(i=>({...i})) : [{emoji:'🍽️', name:''}];

  render(`
    <div class="topbar">
      <span>🛠️ Admin panel</span>
      <span class="link" id="logoutLink">Logout</span>
    </div>
    ${msg ? `<div class="msg ok">${escapeHtml(msg)}</div>` : ''}
    <h2 class="section-title">Set today's menu</h2>
    <div id="itemRows" class="stack"></div>
    <button class="btn ghost" id="addItemBtn" style="margin-top:6px;">+ Add item</button>
    <div class="divider"></div>
    <button class="btn" id="saveMenuBtn">Save menu</button>

    <div class="divider"></div>
    <h2 class="section-title">Results</h2>
    <label for="reportDate">Select date</label>
    <select id="reportDate"></select>
    <div id="tallyBox"></div>
    <button class="btn ghost" id="downloadPdfBtn">📄 Download PDF report</button>
  `);

  renderItemRows();
  document.getElementById('addItemBtn').onclick = ()=>{
    draftItems.push({emoji:'🍽️', name:''});
    renderItemRows();
  };
  document.getElementById('saveMenuBtn').onclick = async ()=>{
    const cleaned = draftItems.filter(i=>i.name.trim() !== '');
    if(cleaned.length === 0){
      renderAdminScreen('At least one menu item is required.');
      return;
    }
    try{
      await saveMenu(todayStr(), cleaned);
      renderAdminScreen('Menu saved successfully.');
    }catch(e){
      renderAdminScreen(e.message);
    }
  };
  document.getElementById('logoutLink').onclick = doLogout;

  await populateReportDates(date);
  document.getElementById('reportDate').onchange = async (e)=>{
    await refreshTally(e.target.value);
  };
  await refreshTally(date);
  document.getElementById('downloadPdfBtn').onclick = ()=> downloadReport(document.getElementById('reportDate').value);
}

function renderItemRows(){
  const wrap = document.getElementById('itemRows');
  wrap.innerHTML = draftItems.map((item, idx)=>`
    <div class="field-row" data-idx="${idx}">
      <input type="text" class="emoji-input" value="${escapeHtml(item.emoji)}" data-field="emoji" maxlength="4">
      <input type="text" class="name-input" value="${escapeHtml(item.name)}" data-field="name" placeholder="Item name">
      <button class="icon-btn" data-remove="${idx}" aria-label="Remove item">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.oninput = ()=>{
      const idx = parseInt(inp.closest('.field-row').dataset.idx, 10);
      draftItems[idx][inp.dataset.field] = inp.value;
    };
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.remove, 10);
      draftItems.splice(idx,1);
      renderItemRows();
    };
  });
}

async function populateReportDates(defaultDate){
  const sel = document.getElementById('reportDate');
  const dates = [];
  for(let i=0;i<14;i++){
    const d = new Date();
    d.setDate(d.getDate()-i);
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  sel.innerHTML = dates.map(d=>`<option value="${d}" ${d===defaultDate?'selected':''}>${d}</option>`).join('');
}

async function refreshTally(date){
  const box = document.getElementById('tallyBox');
  let votesData;
  try{
    votesData = await getVotesData(date);
  }catch(e){
    box.innerHTML = `<div class="msg error">${escapeHtml(e.message)}</div>`;
    return;
  }
  box.innerHTML = `<p class="hint" style="margin-top:0;">Total votes: ${votesData.total}</p>` + buildTallyHtml(votesData.tally, votesData.total);
}

async function downloadReport(date){
  let votesData;
  try{
    votesData = await getVotesData(date);
  }catch(e){
    alert(e.message);
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(18);
  doc.text('Lunch Poll Report', 20, y);
  y += 10;
  doc.setFontSize(11);
  doc.text('Date: ' + date, 20, y);
  y += 6;
  doc.text('Total votes: ' + votesData.total, 20, y);
  y += 12;
  doc.setFontSize(13);
  doc.text('Results:', 20, y);
  y += 8;
  doc.setFontSize(11);
  votesData.tally.forEach(item=>{
    const pct = votesData.total > 0 ? Math.round((item.count/votesData.total)*100) : 0;
    doc.text(`${item.name}: ${item.count} votes (${pct}%)`, 26, y);
    y += 7;
  });
  y += 8;
  doc.setFontSize(13);
  doc.text('Voter list:', 20, y);
  y += 8;
  doc.setFontSize(10);
  const voterList = votesData.voterList || [];
  if(voterList.length === 0){
    doc.text('No votes recorded for this date.', 26, y);
    y += 6;
  }
  const namesById = {};
  votesData.tally.forEach(i => namesById[i.id] = i.name);
  voterList.forEach(({username, menu_item_id})=>{
    if(y > 280){ doc.addPage(); y = 20; }
    doc.text(`${username} -> ${namesById[menu_item_id] || menu_item_id}`, 26, y);
    y += 6;
  });
  doc.save(`lunch-poll-report-${date}.pdf`);
}

// ---------- INIT ----------
(async ()=>{
  try{
    const data = await api('/api/me');
    if(data.user){
      currentUser = data.user.username;
      isAdmin = data.user.isAdmin;
      if(isAdmin){ await renderAdminScreen(); } else { await renderLanding(); }
      return;
    }
  }catch(e){}
  renderAuth();
})();
</script>
